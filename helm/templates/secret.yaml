{{- if and (not .Values.artifactory.existingSecret) (not .Values.artifactory.tokenFile.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "groundcrew.tokenSecret" . }}
  labels: {{- include "groundcrew.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.artifactory.tokenKey }}: {{ .Values.artifactory.token | quote }}
{{- end }}
