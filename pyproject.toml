[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artifactory-groundcrew"
version = "0.6.0"
description = "Keeps public package repositories mirrored inside JFrog Artifactory"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tenacity>=8.2",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "zstandard>=0.22",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
artifactory-groundcrew = "artifactory_groundcrew.__main__:main"
groundcrew = "artifactory_groundcrew.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/artifactory_groundcrew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
